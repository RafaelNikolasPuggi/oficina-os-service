# Escalabilidade dinâmica: entre 1 e 10 réplicas conforme consumo de
# CPU/memória — atende picos de abertura de OS sem intervenção manual.
# minReplicas=1 (não 2): os 2 nós t3.small do cluster compartilhado têm
# limite baixo de pods por nó, e já dividem espaço com RabbitMQ, Mongo e os
# DaemonSets do New Relic — 2 réplicas fixas por serviço não cabiam.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: oficina-os-app
  namespace: oficina-os
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: oficina-os-app
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
