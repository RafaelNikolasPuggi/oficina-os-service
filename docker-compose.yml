services:
  postgres:
    image: postgres:16-alpine
    container_name: oficina-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-oficina_os}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-oficina_os}
      POSTGRES_DB: ${DB_DATABASE:-oficina_os}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - oficina_os_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-oficina_os}']
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: oficina-os-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI (visualizar os e-mails enviados)

  # Compartilhado pelos 3 microsserviços (Saga) — producao-service e
  # pagamento-service apontam pra este mesmo broker em dev local.
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: oficina-rabbitmq
    restart: unless-stopped
    ports:
      - '5672:5672' # AMQP
      - '15672:15672' # Management UI (guest/guest)
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'check_port_connectivity']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: production
    container_name: oficina-os-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-oficina_os}
      DB_PASSWORD: ${DB_PASSWORD:-oficina_os}
      DB_DATABASE: ${DB_DATABASE:-oficina_os}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      PRODUCAO_SERVICE_URL: ${PRODUCAO_SERVICE_URL:-http://producao-service:3001}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_SECURE: 'false'
      SMTP_FROM: ${SMTP_FROM:-oficina@example.com}
    ports:
      - '${PORT:-3000}:3000'

volumes:
  oficina_os_postgres_data:
